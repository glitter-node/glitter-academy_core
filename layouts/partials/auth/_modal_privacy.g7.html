<partial>
  <modal data-type="composite" data-ref="privacyModal" title="$t:policy.privacy.title" size="lg" class="overflow-hidden">
    <div class="flex flex-col">
      <div data-if="{{privacyContent?.loading}}" class="flex justify-center items-center py-12">
        <div class="w-8 h-8 border-4 border-slate-300 dark:border-slate-600 border-t-teal-500 rounded-full animate-spin"/>
      </div>
      <div data-if="{{!privacyContent?.loading &amp;&amp; privacyContent?.data?.published_at}}" class="flex-shrink-0 flex items-center gap-2 mb-3">
        <span class="text-sm text-slate-500 dark:text-slate-400">$t:policy.published_at: {{privacyContent?.data?.published_at | date}}</span>
      </div>
      <div data-if="{{!privacyContent?.loading &amp;&amp; privacyContent?.data}}" class="flex-1 overflow-y-auto min-h-0 max-h-96">
        <extension-point name="html_content" data-ref="privacy_html_content" content="{{privacyContent?.data?.content ?? ''}}" isHtml="{{(privacyContent?.data?.content_mode ?? 'html') === 'html'}}" class="prose dark:prose-invert prose-sm max-w-none text-slate-700 dark:text-slate-300">
          <default>
            <html-content data-type="composite" content="{{privacyContent?.data?.content ?? ''}}" isHtml="{{(privacyContent?.data?.content_mode ?? 'html') === 'html'}}" class="prose dark:prose-invert prose-sm max-w-none text-slate-700 dark:text-slate-300"/>
          </default>
        </extension-point>
      </div>
      <div data-if="{{!privacyContent?.loading &amp;&amp; !privacyContent?.data}}" class="py-8 text-center text-slate-500 dark:text-slate-400">$t:policy.no_content</div>
      <div class="flex-shrink-0 flex justify-end gap-3 mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
        <button class="px-4 py-2 bg-teal-600 dark:bg-teal-500 text-white rounded-lg hover:bg-teal-700 dark:hover:bg-teal-600">
          <on type="click">
            <close-modal/>
          </on>
          $t:common.close
        </button>
      </div>
    </div>
  </modal>
</partial>
