<partial>
  <div>
    <container data-type="layout" data-if="{{!posts?.data?.board &amp;&amp; !_global.hasError}}" class="py-8">
      <div class="flex justify-between items-start mb-4">
        <div class="space-y-2">
          <div class="h-8 w-48 bg-slate-200 dark:bg-slate-700 rounded animate-pulse"/>
          <div class="h-4 w-64 bg-slate-200 dark:bg-slate-700 rounded animate-pulse"/>
        </div>
        <div class="h-10 w-28 bg-slate-200 dark:bg-slate-700 rounded-lg animate-pulse"/>
      </div>
      <div class="flex justify-end mb-8">
        <div class="h-10 w-64 bg-slate-200 dark:bg-slate-700 rounded-lg animate-pulse"/>
      </div>
      <div class="flex flex-col items-center justify-center py-16">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 dark:border-slate-700 border-t-slate-900 dark:border-t-white mb-4"/>
        <p class="text-slate-600 dark:text-slate-400 text-base font-medium">$t:board.loading_posts</p>
      </div>
    </container>
    <container data-type="layout" data-if="{{_global.hasError}}" class="py-8">
      <div class="flex flex-col items-center justify-center py-16 text-center">
        <div class="text-5xl rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center mb-6 p-4">
          <icon name="triangle-exclamation" class="text-amber-600 dark:text-amber-400"/>
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-3">$t:board.error_title</h2>
        <p class="text-slate-600 dark:text-slate-400 mb-8 max-w-md">$t:board.error_description</p>
        <button class="inline-flex items-center gap-2 px-6 py-3 bg-teal-600 dark:bg-teal-500 text-white rounded-lg hover:bg-teal-700 dark:hover:bg-teal-600 font-medium transition-colors cursor-pointer">
          <on type="click">
            <refresh/>
          </on>
          <icon name="sync" size="lg"/>
          <span>$t:board.reload_page</span>
        </button>
      </div>
    </container>
  </div>
</partial>
