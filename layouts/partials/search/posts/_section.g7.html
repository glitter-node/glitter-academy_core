<partial>
  <div class="bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden mt-4">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50">
      <div class="flex items-center gap-2">
        <icon name="file-text" size="sm" class="text-slate-500 dark:text-slate-400"/>
        <span class="font-medium text-slate-900 dark:text-white">$t:search.tabs.posts</span>
        <span class="text-sm text-teal-600 dark:text-teal-400">{{(searchResults?.data?.posts_count ?? 0) | number}}</span>
      </div>
      <button data-if="{{(searchResults?.data?.posts_count ?? 0) > 0}}" class="text-sm text-teal-600 dark:text-teal-400 hover:underline flex items-center gap-1">
        <on type="click">
          <set-state target="global" searchActiveTab="posts" :searchPage="1"/>
          <refetch-data-source dataSourceId="searchResults"/>
        </on>
        <span>$t:search.view_all</span>
        <icon name="chevron-right" size="sm"/>
      </button>
    </div>
    <div data-if="{{searchResults?.data?.posts?.items?.length > 0}}" data-each="post, idx in {{searchResults?.data?.posts?.items ?? []}}">
      <div data-if="{{idx > 0}}" class="border-t border-slate-200 dark:border-slate-700"/>
      <button class="block w-full text-left p-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors cursor-pointer">
        <on type="click">
          <navigate path="{{post?.url}}"/>
        </on>
        <div class="flex items-start gap-2 mb-1">
          <span data-if="{{post?.board_name}}" class="flex-shrink-0 text-xs font-medium text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-900/30 px-2 py-0.5 rounded">{{post?.board_name}}</span>
          <html-content data-type="composite" content="{{post?.title_highlighted ?? post?.title}}" class="font-medium text-slate-900 dark:text-white [&amp;_mark]:bg-teal-100 [&amp;_mark]:dark:bg-teal-500/30 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        </div>
        <html-content data-type="composite" data-if="{{post?.content_preview}}" content="{{post?.content_preview_highlighted ?? post?.content_preview}}" class="text-sm text-slate-600 dark:text-slate-400 mb-2 line-clamp-2 [&amp;_mark]:bg-teal-100 [&amp;_mark]:dark:bg-teal-500/30 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
          <span>{{post?.author_name}}</span>
          <span title="{{post?.created_at ?? ''}}">{{post?.created_at_formatted ?? ''}}</span>
          <span data-if="{{(post?.view_count ?? 0) > 0}}" class="flex items-center gap-1">
            <icon name="eye" size="xs"/>
            <span>{{post?.view_count}}</span>
          </span>
          <span data-if="{{(post?.comment_count ?? 0) > 0}}" class="flex items-center gap-1">
            <icon name="message-square" size="xs"/>
            <span>{{post?.comment_count}}</span>
          </span>
        </div>
      </button>
    </div>
    <div data-if="{{!searchResults?.data?.posts?.items || searchResults?.data?.posts?.items?.length === 0}}" class="px-4 py-6 text-center text-sm text-slate-500 dark:text-slate-400">
      <span>$t:search.empty.posts_in_all</span>
    </div>
  </div>
</partial>
