<partial>
  <modal data-type="composite" data-ref="notification_delete_all_confirm_modal" title="$t:mypage.notifications.delete_all_title" size="small">
    <p class="text-slate-700 dark:text-slate-300">$t:mypage.notifications.delete_all_confirm</p>
    <div class="flex justify-end gap-3 mt-6">
      <button class="px-4 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeletingAllNotifications}}" type="button">
        <on type="click">
          <close-modal target="notification_delete_all_confirm_modal"/>
        </on>
        $t:common.cancel
      </button>
      <button class="flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeletingAllNotifications}}" type="button">
        <on type="click">
          <set-state target="global" :isDeletingAllNotifications="true"/>
          <api-call :auth_required="true" target="/api/user/notifications/all" method="DELETE">
            <success>
              <set-state target="global" :isDeletingAllNotifications="false" :notificationsCurrentPage="1" :notificationsHasMore="null" :notificationsLoadingMore="false"/>
              <toast type="success" message="$t:mypage.notifications.delete_all_success"/>
              <refetch-data-source dataSourceId="notifications"/>
              <refetch-data-source dataSourceId="notification_unread_count"/>
              <refetch-data-source dataSourceId="userNotifications"/>
              <close-modal target="notification_delete_all_confirm_modal"/>
            </success>
            <fail>
              <set-state target="global" :isDeletingAllNotifications="false"/>
              <toast type="error" message="{{error.message ?? $t:mypage.notifications.delete_all_failed}}"/>
            </fail>
          </api-call>
        </on>
        <icon data-if="{{_global.isDeletingAllNotifications}}" name="spinner" class="w-4 h-4 animate-spin"/>
        <span>{{_global.isDeletingAllNotifications ? $t:common.deleting : $t:common.delete}}</span>
      </button>
    </div>
  </modal>
</partial>
