<partial>
  <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4 shadow-md border border-slate-200/70 dark:border-slate-700 h-full flex flex-col transition-all hover:shadow-lg">
    <h3 class="text-lg font-semibold text-slate-900 dark:text-white flex items-center gap-2 mb-3">
      <icon name="flame" class="w-5 h-5 text-orange-500"/>
      <span>$t:home.popular_boards</span>
    </h3>
    <div data-if="{{(popular_boards?.data ?? []).length > 0}}" data-each="board, index in {{popular_boards?.data ?? []}}" class="space-y-2 mb-1">
      <button class="w-full text-left flex items-center justify-between py-2 hover:bg-slate-50 dark:hover:bg-slate-700/50 rounded-lg transition-colors cursor-pointer">
        <on type="click">
          <navigate path="/board/{{board?.slug ?? ''}}"/>
        </on>
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <span class="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xs font-medium text-slate-600 dark:text-slate-300">{{index + 1}}</span>
          <span data-if="{{(board?.slug ?? '') === 'notice'}}" class="text-sm font-medium text-slate-900 dark:text-white">$t:boards.notice</span>
          <span data-if="{{(board?.slug ?? '') === 'free'}}" class="text-sm font-medium text-slate-900 dark:text-white">$t:boards.free</span>
          <span data-if="{{(board?.slug ?? '') === 'qna'}}" class="text-sm font-medium text-slate-900 dark:text-white">$t:boards.qna</span>
          <span data-if="{{(board?.slug ?? '') === 'resources'}}" class="text-sm font-medium text-slate-900 dark:text-white">$t:boards.resources</span>
          <span data-if="{{(board?.slug ?? '') === 'introductions'}}" class="text-sm font-medium text-slate-900 dark:text-white">$t:boards.introductions</span>
          <span data-if="{{(board?.slug ?? '') === 'support'}}" class="text-sm font-medium text-slate-900 dark:text-white">$t:boards.support</span>
          <span data-if="{{!['notice','free','qna','resources','introductions','support'].includes(board?.slug ?? '')}}" class="text-sm font-medium text-slate-900 dark:text-white">{{board?.name ?? ''}}</span>
        </div>
        <span class="text-xs font-medium text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-900/30 px-2 py-1 rounded">{{board?.posts_count ?? 0 | number}}</span>
      </button>
    </div>
    <div data-if="{{(popular_boards?.data ?? []).length === 0}}" class="text-center py-7 px-4 text-slate-500 dark:text-slate-400 flex-grow flex flex-col items-center justify-center min-h-[180px] rounded-lg border border-dashed border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-900/30">
      <icon name="bar-chart-3" class="w-8 h-8 mx-auto mb-3 text-orange-500"/>
      <h4 class="text-sm font-semibold text-slate-900 dark:text-white mb-1">$t:home.popular_boards_empty_title</h4>
      <p class="text-sm max-w-sm">$t:home.popular_boards_empty_description</p>
      <button type="button" class="mt-4 inline-flex items-center gap-1 text-sm font-medium text-teal-600 dark:text-teal-400 hover:underline cursor-pointer">
        <on type="click">
          <navigate path="/boards"/>
        </on>
        <span>$t:home.empty_browse_boards</span>
        <icon name="arrow-right" class="w-4 h-4"/>
      </button>
    </div>
  </div>
</partial>
