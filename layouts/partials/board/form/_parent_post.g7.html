<partial>
  <div data-ref="parent_post_card" data-if="{{(form_data?.data?.parent_id || query?.parent_id) &amp;&amp; form_meta?.data?.parent_post?.id}}" class="mb-6 p-4 bg-slate-50 dark:bg-slate-700/50 border-l-4 border-slate-400 dark:border-slate-500 rounded-r-lg">
    <div class="flex items-center gap-2 mb-3">
      <icon name="reply" class="w-4 h-4 text-teal-600 dark:text-teal-400"/>
      <span class="text-sm font-semibold text-slate-900 dark:text-white">$t:board.form.reply_to</span>
      <badge data-if="{{form_meta?.data?.parent_post?.is_notice}}" variant="danger">$t:board.post.notice</badge>
      <badge data-if="{{form_meta?.data?.parent_post?.is_secret}}" variant="warning">$t:board.post.secret</badge>
    </div>
    <div class="flex items-center gap-2 mb-2">
      <h4 class="text-base font-semibold text-slate-900 dark:text-white">{{form_meta?.data?.parent_post?.title}}</h4>
      <a href="/board/{{route.slug}}/{{form_meta?.data?.parent_post?.id}}" title="$t:board.form.view_original" class="text-teal-600 dark:text-teal-400 hover:text-teal-700 dark:hover:text-teal-300 transition-colors">
        <icon name="arrow-up-right-from-square" class="w-3.5 h-3.5"/>
      </a>
    </div>
    <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-3">
      <span>{{form_meta?.data?.parent_post?.author?.name ?? '$t:board.unknown_author'}}</span>
      <span>·</span>
      <span>{{form_meta?.data?.parent_post?.created_at}}</span>
    </div>
    <div data-if="{{form_meta?.data?.parent_post?.content}}" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded p-3">
      <extension-point name="html_content" content="{{form_meta?.data?.parent_post?.content ?? ''}}" isHtml="{{(form_meta?.data?.parent_post?.content_mode ?? 'text') === 'html'}}" class="{{_local.parentPostExpanded ? '' : 'line-clamp-3'}} text-sm text-slate-600 dark:text-slate-300 mb-2">
        <default>
          <html-content data-type="composite" content="{{form_meta?.data?.parent_post?.content ?? ''}}" isHtml="{{(form_meta?.data?.parent_post?.content_mode ?? 'text') === 'html'}}" class="{{_local.parentPostExpanded ? '' : 'line-clamp-3'}} text-sm text-slate-600 dark:text-slate-300 mb-2"/>
        </default>
      </extension-point>
      <button data-if="{{(form_meta?.data?.parent_post?.content?.length ?? 0) > 150}}" type="button" class="text-xs text-teal-600 dark:text-teal-400 hover:text-teal-700 dark:hover:text-teal-300 font-medium transition-colors flex items-center gap-1">
        <on type="click">
          <set-state target="local" parentPostExpanded="{{!_local.parentPostExpanded}}"/>
        </on>
        <span>{{_local.parentPostExpanded ? '$t:board.form.hide_content' : '$t:board.form.show_full_content'}}</span>
        <icon name="{{_local.parentPostExpanded ? 'chevron-up' : 'chevron-down'}}" class="w-3 h-3"/>
      </button>
    </div>
  </div>
</partial>
