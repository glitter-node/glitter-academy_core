<partial>
  <div class="flex gap-3 p-4 rounded-lg">
    <class-map key="{{Math.min(comment?.depth ?? 0, 10)}}" default="ml-0">
      <variant when="0">ml-0</variant>
      <variant when="1">ml-4</variant>
      <variant when="2">ml-8</variant>
      <variant when="3">ml-12</variant>
      <variant when="4">ml-16</variant>
      <variant when="5">ml-20</variant>
      <variant when="6">ml-24</variant>
      <variant when="7">ml-28</variant>
      <variant when="8">ml-32</variant>
      <variant when="9">ml-36</variant>
      <variant when="10">ml-40</variant>
    </class-map>
    <icon data-type="composite" data-if="{{(comment?.depth ?? 0) > 0}}" name="turn-up" size="sm" class="fa-rotate-90 text-slate-400 dark:text-slate-500 flex-shrink-0 self-start mt-4"/>
    <avatar data-type="composite" author="{{comment?.author}}" size="sm"/>
    <div class="flex-1">
      <div class="flex items-start justify-between mb-1">
        <div class="flex items-center gap-1">
          <user-info data-type="composite" author="{{comment?.author}}" subText="{{comment?.created_at_formatted ?? ''}}" subTextTitle="{{comment?.created_at ?? ''}}" layout="horizontal"/>
        </div>
        <div data-if="{{!comment?.deleted_at &amp;&amp; comment?.status !== 'blinded' &amp;&amp; ((comment?.is_author &amp;&amp; post?.data?.abilities?.can_write_comments) || comment?.is_guest_comment || post?.data?.abilities?.can_manage || (_global.currentUser?.uuid &amp;&amp; post?.data?.board?.use_report &amp;&amp; !comment?.is_author) || (post?.data?.abilities?.can_write_comments &amp;&amp; (comment?.depth ?? 0) < (post?.data?.board?.max_comment_depth ?? 10) &amp;&amp; post?.data?.status !== 'blinded' &amp;&amp; post?.data?.status !== 'deleted' &amp;&amp; !post?.data?.deleted_at))}}" class="relative">
          <button class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1 cursor-pointer">
            <on type="click">
              <set-state target="local" commentDropdownId="{{_local.commentDropdownId === comment?.id ? null : comment?.id}}"/>
            </on>
            <icon data-type="composite" name="ellipsis-vertical" size="sm"/>
          </button>
          <div data-if="{{_local.commentDropdownId === comment?.id}}" class="absolute right-0 top-full mt-1 bg-white dark:bg-slate-700 rounded-lg shadow-lg border border-slate-200 dark:border-slate-600 py-1 min-w-[120px] z-10">
            <button data-if="{{comment?.abilities?.can_write &amp;&amp; (comment?.depth ?? 0) < (post?.data?.board?.max_comment_depth ?? 10) &amp;&amp; post?.data?.status !== 'blinded' &amp;&amp; post?.data?.status !== 'deleted' &amp;&amp; !post?.data?.deleted_at}}" class="w-full px-4 py-2 text-left text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 flex items-center gap-2 cursor-pointer">
              <on type="click">
                <set-state target="local" :commentDropdownId="null" :editingCommentId="null" :editingCommentContent="null"/>
                <set-state target="local" replyToCommentId="{{comment?.id}}" replyToCommentDepth="{{comment?.depth ?? 0}}"/>
              </on>
              <icon data-type="composite" name="share" size="sm"/>
              <span>$t:board.reply</span>
            </button>
            <button data-if="{{(comment?.is_author &amp;&amp; post?.data?.abilities?.can_write_comments) || comment?.is_guest_comment || post?.data?.abilities?.can_manage}}" class="w-full px-4 py-2 text-left text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 flex items-center gap-2 cursor-pointer">
              <on type="click">
                <set-state target="local" :commentDropdownId="null"/>
                <set-state if="{{comment?.is_guest_comment &amp;&amp; !post?.data?.abilities?.can_manage}}" target="global">
                  <field name="guestPasswordModal">
                    <field name="targetType" value="comment"/>
                    <field name="action" value="edit"/>
                    <field name="apiEndpoint" value="/api/modules/sirsoft-board/boards/{{route.slug}}/comments/{{comment?.id}}/verify-password"/>
                    <field name="storageKey" value="verified_guest_comment_{{comment?.id}}"/>
                    <field name="redirectPath" :value="null"/>
                    <field name="commentEdit">
                      <field name="editingCommentId" value="{{comment?.id}}"/>
                      <field name="editingCommentContent" value="{{comment?.content}}"/>
                    </field>
                    <field name="isVerifying" :value="false"/>
                  </field>
                </set-state>
                <open-modal if="{{comment?.is_guest_comment &amp;&amp; !post?.data?.abilities?.can_manage}}" target="board_guest_password_modal"/>
                <set-state if="{{!comment?.is_guest_comment || post?.data?.abilities?.can_manage}}" target="global" :replyToCommentId="null" :replyToCommentDepth="null">
                  <field name="commentEdit">
                    <field name="editingCommentId" value="{{comment?.id}}"/>
                    <field name="editingCommentContent" value="{{comment?.content}}"/>
                  </field>
                </set-state>
              </on>
              <icon data-type="composite" name="edit" size="sm"/>
              <span>$t:common.edit</span>
            </button>
            <button data-if="{{(comment?.is_author &amp;&amp; post?.data?.abilities?.can_write_comments) || comment?.is_guest_comment || post?.data?.abilities?.can_manage}}" class="w-full px-4 py-2 text-left text-sm text-red-600 dark:text-red-400 hover:bg-slate-100 dark:hover:bg-slate-600 flex items-center gap-2 cursor-pointer">
              <on type="click">
                <set-state target="local" :commentDropdownId="null"/>
                <set-state target="global">
                  <field name="deleteModal">
                    <field name="type" value="comment"/>
                    <field name="isGuest" value="{{comment?.is_guest_comment &amp;&amp; !post?.data?.abilities?.can_manage}}"/>
                    <field name="apiEndpoint" value="/api/modules/sirsoft-board/boards/{{route.slug}}/posts/{{route.id}}/comments/{{comment?.id}}"/>
                  </field>
                </set-state>
                <open-modal target="board_delete_modal"/>
              </on>
              <icon data-type="composite" name="trash" size="sm"/>
              <span>$t:common.delete</span>
            </button>
            <button data-if="{{_global.currentUser?.uuid &amp;&amp; post?.data?.board?.use_report &amp;&amp; !comment?.is_author &amp;&amp; !comment?.is_already_reported}}" class="w-full px-4 py-2 text-left text-sm text-orange-600 dark:text-orange-400 hover:bg-slate-100 dark:hover:bg-slate-600 flex items-center gap-2 cursor-pointer">
              <on type="click">
                <set-state target="local" :commentDropdownId="null"/>
                <set-state target="global">
                  <field name="reportModal">
                    <field name="type" value="comment"/>
                    <field name="comment_content" value="{{comment?.content ?? ''}}"/>
                    <field name="comment_author_name" value="{{comment?.author?.name ?? comment?.guest_name ?? ''}}"/>
                    <field name="comment_author_avatar" value="{{comment?.author?.avatar ?? ''}}"/>
                    <field name="comment_created_at" value="{{comment?.created_at ?? ''}}"/>
                    <field name="apiEndpoint" value="/api/modules/sirsoft-board/boards/{{route.slug}}/comments/{{comment?.id}}/reports"/>
                  </field>
                </set-state>
                <set-state target="global">
                  <field name="reportForm">
                    <field name="reason_type" value=""/>
                    <field name="reason_detail" value=""/>
                  </field>
                </set-state>
                <open-modal target="board_report_modal"/>
              </on>
              <icon data-type="composite" name="flag" size="sm"/>
              <span>$t:board.post.report</span>
            </button>
            <button data-if="{{_global.currentUser?.uuid &amp;&amp; post?.data?.board?.use_report &amp;&amp; !comment?.is_author &amp;&amp; comment?.is_already_reported}}" :disabled="true" class="w-full px-4 py-2 text-left text-sm text-slate-400 dark:text-slate-500 flex items-center gap-2 cursor-not-allowed opacity-60">
              <icon data-type="composite" name="flag" size="sm"/>
              <span>$t:board.post.reported</span>
            </button>
          </div>
        </div>
      </div>
      <div data-if="{{comment?.deleted_at &amp;&amp; _global.commentEdit?.editingCommentId !== comment?.id}}" class="py-3 px-4 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 mb-2">
        <div class="flex items-center gap-3 text-slate-400 dark:text-slate-500">
          <icon data-type="composite" name="trash" size="sm"/>
          <span class="text-sm font-medium">$t:board.comment.deleted_comment_content</span>
          <button data-if="{{post?.data?.abilities?.can_manage === true}}" class="text-xs px-2 py-0.5 rounded bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 hover:bg-teal-100 dark:hover:bg-teal-900/30 transition-colors cursor-pointer">
            <on type="click">
              <set-state target="local" showDeletedContent="{{_local.showDeletedContent === comment?.id ? null : comment?.id}}"/>
            </on>
            {{_local.showDeletedContent === comment?.id ? '$t:board.comment.hide_original' : '$t:board.comment.view_original'}}
          </button>
        </div>
        <div data-if="{{_local.showDeletedContent === comment?.id}}" class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-700">
          <p class="text-sm text-slate-700 dark:text-slate-300">{{comment?.content}}</p>
        </div>
      </div>
      <div data-if="{{!comment?.deleted_at &amp;&amp; comment?.status === 'blinded' &amp;&amp; _global.commentEdit?.editingCommentId !== comment?.id}}" class="py-3 px-4 bg-slate-100 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 mb-2">
        <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400">
          <icon data-type="composite" name="eye-slash" size="sm"/>
          <span class="text-sm font-medium">$t:board.comment.blinded_comment</span>
          <button data-if="{{comment?.content}}" class="text-xs px-2 py-0.5 rounded bg-teal-50 dark:bg-teal-900/20 text-teal-600 dark:text-teal-400 hover:bg-teal-100 dark:hover:bg-teal-900/30 transition-colors cursor-pointer">
            <on type="click">
              <set-state target="local" showBlindedCommentContent="{{Object.assign({}, _local.showBlindedCommentContent || {}, {[comment?.id]: !(_local.showBlindedCommentContent?.[comment?.id])})}}"/>
            </on>
            {{_local.showBlindedCommentContent?.[comment?.id] ? '$t:board.hide_original' : '$t:board.view_original'}}
          </button>
        </div>
        <div data-if="{{_local.showBlindedCommentContent?.[comment?.id] &amp;&amp; comment?.content}}" class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-700">
          <p class="text-sm text-slate-700 dark:text-slate-300">{{comment?.content}}</p>
        </div>
      </div>
      <p data-if="{{!comment?.deleted_at &amp;&amp; comment?.status !== 'blinded' &amp;&amp; _global.commentEdit?.editingCommentId !== comment?.id}}" class="text-slate-700 dark:text-slate-300">{{comment?.content}}</p>
      <div data-if="{{_global?.commentEdit?.editingCommentId === comment?.id}}" class="mb-2">
        <textarea name="editing_comment_content" value="{{_global?.commentEdit?.editingCommentContent ?? comment?.content}}" :rows="3" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 resize-none">
          <on type="input">
            <set-state target="global">
              <field name="commentEdit">
                <field name="editingCommentId" value="{{_global.commentEdit?.editingCommentId}}"/>
                <field name="editingCommentContent" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </textarea>
        <div class="flex justify-end gap-2 mt-2">
          <button class="px-4 py-2 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors cursor-pointer">
            <on type="click">
              <set-state target="global" :commentEdit="null" :verifiedGuestPassword="null">
                <field name="form">
                  <field name="editing_comment_content" value=""/>
                </field>
              </set-state>
            </on>
            $t:common.cancel
          </button>
          <button class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.editingCommentSubmitting === true}}">
            <on type="click">
              <sequence if="{{_local.editingCommentSubmitting !== true}}">
                <set-state target="local" :editingCommentSubmitting="true"/>
                <api-call :auth_required="true" target="/api/modules/sirsoft-board/boards/{{route?.slug}}/posts/{{route?.id}}/comments/{{comment?.id}}" method="PUT">
                  <success>
                    <set-state target="local" :editingCommentId="null" :editingCommentContent="null" :editingCommentSubmitting="false"/>
                    <set-state target="global" :commentEdit="null" :verifiedGuestPassword="null"/>
                    <refetch-data-source dataSourceId="post"/>
                    <toast type="success" message="$t:board.comment_updated"/>
                  </success>
                  <fail>
                    <set-state target="local" :editingCommentSubmitting="false"/>
                    <toast type="error" message="{{error?.message ?? '$t:board.comment_update_error'}}"/>
                  </fail>
                  <body content="{{_global.commentEdit?.editingCommentContent}}" password="{{comment?.is_guest_comment ? _global.verifiedGuestPassword : undefined}}"/>
                </api-call>
              </sequence>
            </on>
            <div class="flex items-center gap-2">
              <icon data-type="composite" data-if="{{_local.editingCommentSubmitting}}" name="spinner" size="sm" class="animate-spin"/>
              <span>$t:common.save</span>
            </div>
          </button>
        </div>
      </div>
      <div data-if="{{_local.replyToCommentId === comment?.id &amp;&amp; post?.data?.status !== 'blinded' &amp;&amp; post?.data?.status !== 'deleted' &amp;&amp; !post?.data?.deleted_at}}" class="mt-4 ml-14 p-4 bg-teal-50 dark:bg-teal-900/10 rounded-lg border border-teal-200 dark:border-teal-800">
        <div class="flex items-center gap-2 text-sm text-teal-600 dark:text-teal-400 font-medium mb-3">
          <icon data-type="composite" name="share" size="sm"/>
          <span>$t:board.replying_to|name={{comment?.author?.name}}</span>
        </div>
        <div data-if="{{!_global.currentUser?.uuid}}" class="flex gap-3 mb-3">
          <input type="text" name="guest_reply_author_name" value="{{_local.guest_reply_author_name ?? ''}}" placeholder="$t:board.guest_author_name" class="flex-1 px-4 py-2 border border-teal-300 dark:border-teal-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
            <on type="input">
              <set-state target="local" guest_reply_author_name="{{$event.target.value}}"/>
            </on>
          </input>
          <input type="password" name="guest_reply_password" value="{{_local.guest_reply_password ?? ''}}" placeholder="$t:board.guest_password" class="flex-1 px-4 py-2 border border-teal-300 dark:border-teal-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
            <on type="input">
              <set-state target="local" guest_reply_password="{{$event.target.value}}"/>
            </on>
          </input>
        </div>
        <div class="flex gap-3">
          <avatar data-type="composite" data-if="{{_global.currentUser?.uuid}}" name="{{_global.currentUser?.name}}" avatar="{{_global.currentUser?.avatar}}" size="sm"/>
          <div class="flex-1">
            <textarea name="reply_content" value="{{_local.reply_content ?? ''}}" placeholder="$t:board.reply_placeholder" :rows="3" class="w-full px-4 py-2 border border-teal-300 dark:border-teal-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 resize-none mb-2">
              <on type="input">
                <set-state target="local" reply_content="{{$event.target.value}}"/>
              </on>
            </textarea>
            <div class="flex justify-end gap-2">
              <button class="px-4 py-2 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors cursor-pointer">
                <on type="click">
                  <set-state target="local" :replyToCommentId="null" :replyToCommentDepth="null"/>
                </on>
                $t:common.cancel
              </button>
              <button class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.commentSubmitting === true}}">
                <on type="click">
                  <set-state target="local" :commentSubmitting="true"/>
                  <api-call :auth_required="true" target="/api/modules/sirsoft-board/boards/{{route?.slug}}/posts/{{route?.id}}/comments" method="POST">
                    <success>
                      <set-state target="local" reply_content="" guest_reply_author_name="" guest_reply_password="" :replyToCommentId="null" :replyToCommentDepth="null" :commentSubmitting="false"/>
                      <refetch-data-source dataSourceId="post"/>
                      <toast type="success" message="$t:board.reply_submit_success"/>
                    </success>
                    <fail>
                      <set-state target="local" :commentSubmitting="false"/>
                      <toast type="error" message="{{error.message}}"/>
                    </fail>
                    <body content="{{_local.reply_content}}" parent_id="{{_local.replyToCommentId}}" author_name="{{_local.guest_reply_author_name}}" password="{{_local.guest_reply_password}}"/>
                  </api-call>
                </on>
                <div class="flex items-center gap-2">
                  <icon data-type="composite" data-if="{{!_local.commentSubmitting}}" name="paper-plane" size="sm"/>
                  <icon data-type="composite" data-if="{{_local.commentSubmitting}}" name="spinner" size="sm" class="animate-spin"/>
                  <span>{{_local.commentSubmitting ? '$t:board.comment_submitting' : '$t:board.comment_reply'}}</span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</partial>
