<partial>
  <div data-if="{{post?.data?.abilities?.can_write_comments &amp;&amp; post?.data?.status !== 'blinded' &amp;&amp; post?.data?.status !== 'deleted' &amp;&amp; !post?.data?.deleted_at}}" class="p-4 border-t border-slate-200 dark:border-slate-700">
    <div class="flex gap-3">
      <avatar data-type="composite" name="{{_global.currentUser?.name ?? _local.guest_comment_author_name ?? ''}}" avatar="{{_global.currentUser?.avatar}}" size="sm"/>
      <div class="flex-1 flex flex-col gap-3">
        <div data-if="{{!_global.currentUser?.uuid}}" class="flex gap-3">
          <input type="text" name="guest_author_name" value="{{_local.guest_comment_author_name ?? ''}}" placeholder="$t:board.guest_author_name" class="flex-1 px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
            <on type="input">
              <set-state target="local" guest_comment_author_name="{{$event.target.value}}"/>
            </on>
          </input>
          <input type="password" name="guest_password" value="{{_local.guest_comment_password ?? ''}}" placeholder="$t:board.guest_password" class="flex-1 px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
            <on type="input">
              <set-state target="local" guest_comment_password="{{$event.target.value}}"/>
            </on>
          </input>
        </div>
        <textarea name="comment_content" value="{{_local.new_comment_content ?? ''}}" placeholder="$t:board.comment_placeholder" :rows="3" class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 resize-none">
          <on type="input">
            <set-state target="local" new_comment_content="{{$event.target.value}}"/>
          </on>
        </textarea>
        <div class="flex justify-end">
          <button class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{_local.commentSubmitting === true}}">
            <on type="click">
              <sequence if="{{_local.commentSubmitting !== true}}">
                <set-state target="local" :commentSubmitting="true"/>
                <api-call :auth_required="true" target="/api/modules/sirsoft-board/boards/{{route?.slug}}/posts/{{route?.id}}/comments" method="POST">
                  <success>
                    <set-state target="local" new_comment_content="" guest_comment_author_name="" guest_comment_password="" :replyToCommentId="null" :commentSubmitting="false"/>
                    <refetch-data-source dataSourceId="post"/>
                    <toast type="success" message="$t:board.comment_added"/>
                  </success>
                  <fail>
                    <set-state target="local" :commentSubmitting="false"/>
                    <toast type="error" message="{{error.message}}"/>
                  </fail>
                  <body content="{{_local.new_comment_content}}" author_name="{{_local.guest_comment_author_name}}" password="{{_local.guest_comment_password}}"/>
                </api-call>
              </sequence>
            </on>
            <div class="flex items-center gap-2">
              <icon data-type="composite" data-if="{{!_local.commentSubmitting}}" name="paper-plane" size="sm"/>
              <icon data-type="composite" data-if="{{_local.commentSubmitting}}" name="spinner" size="sm" class="animate-spin"/>
              <span>{{_local.commentSubmitting ? '$t:board.comment_submitting' : '$t:board.comment_submit'}}</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</partial>
