<partial>
  <div>
    <div data-if="{{posts?.data?.board?.slug &amp;&amp; query.page &amp;&amp; Number(query.page) > 1 &amp;&amp; posts?.data?.data?.length === 0}}" class="flex flex-col items-center justify-center py-16 text-center bg-slate-100/70 dark:bg-slate-800/50 rounded-xl">
      <div class="text-6xl mb-4">📄</div>
      <p class="text-slate-600 dark:text-slate-400 mb-2">$t:board.no_posts_on_page</p>
      <button class="inline-flex items-center gap-2 px-4 py-2 border-2 border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 font-medium transition-colors cursor-pointer mt-4">
        <on type="click">
          <navigate path="/board/{{route.slug}}"/>
        </on>
        $t:board.go_to_first_page
      </button>
    </div>
    <div data-if="{{posts?.data?.board?.slug &amp;&amp; !query.search &amp;&amp; !query.category &amp;&amp; (!query.page || Number(query.page) <= 1) &amp;&amp; (posts?.data?.data ?? []).length === 0}}" class="flex flex-col items-center justify-center py-16 text-center bg-slate-100/70 dark:bg-slate-800/50 rounded-xl">
      <div class="text-6xl mb-4">📝</div>
      <p data-if="{{posts?.data?.board?.slug === 'free'}}" class="text-slate-600 dark:text-slate-400 mb-6">$t:board.empty.free.title</p>
      <p data-if="{{posts?.data?.board?.slug === 'qna'}}" class="text-slate-600 dark:text-slate-400 mb-6">$t:board.empty.qna.title</p>
      <p data-if="{{!['free','qna'].includes(posts?.data?.board?.slug ?? '')}}" class="text-slate-600 dark:text-slate-400">$t:board.no_posts</p>
      <button data-if="{{posts?.data?.board?.slug === 'free'}}" type="button" class="inline-flex items-center gap-2 px-4 py-2 bg-teal-600 dark:bg-teal-500 text-white rounded-lg hover:bg-teal-700 dark:hover:bg-teal-600 font-medium transition-colors cursor-pointer">
        <on type="click">
          <switch on="{{_global.currentUser?.uuid ? 'authenticated' : 'guest'}}">
            <case when="authenticated">
              <navigate path="/board/free/write"/>
            </case>
            <case when="guest">
              <navigate path="/login">
                <query redirect="/board/free/write"/>
              </navigate>
            </case>
          </switch>
        </on>
        <icon name="pencil" size="sm"/>
        <span>$t:board.empty.free.cta</span>
      </button>
      <button data-if="{{posts?.data?.board?.slug === 'qna'}}" type="button" class="inline-flex items-center gap-2 px-4 py-2 bg-teal-600 dark:bg-teal-500 text-white rounded-lg hover:bg-teal-700 dark:hover:bg-teal-600 font-medium transition-colors cursor-pointer">
        <on type="click">
          <switch on="{{_global.currentUser?.uuid ? 'authenticated' : 'guest'}}">
            <case when="authenticated">
              <navigate path="/board/qna/write"/>
            </case>
            <case when="guest">
              <navigate path="/login">
                <query redirect="/board/qna/write"/>
              </navigate>
            </case>
          </switch>
        </on>
        <icon name="circle-help" size="sm"/>
        <span>$t:board.empty.qna.cta</span>
      </button>
    </div>
    <div data-if="{{posts?.data?.board?.slug &amp;&amp; (query.search || query.category) &amp;&amp; posts?.data?.pagination?.total === 0}}" class="flex flex-col items-center justify-center py-16 text-center bg-slate-100/70 dark:bg-slate-800/50 rounded-xl">
      <div class="text-6xl mb-4">🔍</div>
      <p class="text-slate-600 dark:text-slate-400 mb-6">$t:board.no_search_results</p>
      <button class="inline-flex items-center gap-2 px-4 py-2 border-2 border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 font-medium transition-colors cursor-pointer">
        <on type="click">
          <navigate path="/board/{{route.slug}}"/>
        </on>
        $t:board.clear_search
      </button>
    </div>
  </div>
</partial>
