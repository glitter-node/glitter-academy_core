<partial>
  <div class="group flex w-full text-left gap-4 px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
    <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center font-bold text-white {{index === 0 ? 'bg-orange-500' : index === 1 ? 'bg-orange-500' : index === 2 ? 'bg-orange-400' : 'bg-slate-400'}}">{{index + 1}}</div>
    <div class="flex-1 min-w-0 flex flex-col gap-1.5">
      <div class="flex items-center gap-2">
        <span class="bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 px-2 py-0.5 rounded text-xs flex-shrink-0">{{post.board_name}}</span>
        <button class="justify-start font-medium text-slate-900 dark:text-white truncate flex-1 group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/board/{{post.board_slug}}/{{post.id}}"/>
          </on>
          {{post.title}}
        </button>
        <span data-if="{{post.is_new}}" class="px-1.5 py-0.5 text-xs bg-red-500 text-white rounded flex-shrink-0">$t:board.new_badge_short</span>
        <span class="text-sm text-slate-500 dark:text-slate-400 flex-shrink-0" title="{{post.created_at ?? ''}}">{{post.created_at_formatted ?? ''}}</span>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <avatar data-type="composite" author="{{post.author}}" size="xs"/>
          <user-info data-type="composite" author="{{post.author}}" :showDropdown="true" class="text-sm"/>
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-xs flex items-center gap-1">
            <icon name="eye" size="xs"/>
            <span>{{post.view_count ?? 0}}</span>
          </span>
          <span class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-xs flex items-center gap-1">
            <icon name="message-square" size="xs"/>
            <span>{{post.comment_count ?? 0}}</span>
          </span>
        </div>
      </div>
    </div>
  </div>
</partial>
