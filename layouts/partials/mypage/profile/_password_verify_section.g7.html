<partial>
  <div data-if="{{!_local?.isPasswordVerified}}" class="max-w-lg mx-auto mt-16">
    <div class="p-8 border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 shadow-sm">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 mb-4 rounded-full bg-slate-100 dark:bg-slate-700">
          <icon name="lock" size="lg" class="text-slate-600 dark:text-slate-400"/>
        </div>
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white mb-2">$t:mypage.profile.verify_password_title</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400">$t:mypage.profile.verify_password_message</p>
      </div>
      <form id="verifyPasswordForm" class="space-y-5">
        <on type="submit">
          <set-state target="local" :isVerifyingPassword="true" :verifyPasswordError="false"/>
          <api-call :auth_required="true" target="/api/me/verify-password" method="POST">
            <success>
              <set-state target="local" :isVerifyingPassword="false" :isPasswordVerified="true" verifyPassword=""/>
            </success>
            <fail>
              <set-state target="local" :isVerifyingPassword="false" :verifyPasswordError="true"/>
            </fail>
            <body password="{{_local.verifyPassword}}"/>
          </api-call>
        </on>
        <div>
          <password-input name="password" value="{{_local?.verifyPassword ?? ''}}" placeholder="$t:mypage.profile.verify_password_placeholder" :showToggle="true" class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:border-transparent transition-colors">
            <on type="change">
              <set-state target="local" verifyPassword="{{$event.target.value}}"/>
            </on>
          </password-input>
          <p data-if="{{_local?.verifyPasswordError}}" class="mt-2 text-sm text-red-600 dark:text-red-400">$t:mypage.profile.verify_password_error</p>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" class="flex-1 px-4 py-2.5 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
            <on type="click">
              <navigate path="/mypage/profile"/>
            </on>
            $t:common.cancel
          </button>
          <button type="submit" form="verifyPasswordForm" loading="{{_local.isVerifyingPassword}}" disabled="{{_local.isVerifyingPassword || !_local.verifyPassword}}" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-teal-600 dark:bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-700 dark:hover:bg-teal-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <icon data-if="{{_local.isVerifyingPassword}}" name="spinner" size="sm"/>
            <span>$t:mypage.profile.verify_password_button</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</partial>
