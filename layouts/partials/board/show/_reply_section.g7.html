<partial>
  <div class="bg-white dark:bg-slate-800 rounded-lg shadow">
    <div class="px-6 pt-6 pb-4 border-b border-slate-200 dark:border-slate-700">
      <h3 class="text-lg font-semibold text-slate-900 dark:text-white flex items-center gap-2">
        <icon data-type="composite" name="comments" size="md" class="text-teal-500 dark:text-teal-400"/>
        <span>$t:board.posts.detail.replies_title|count={{(post?.data?.replies ?? []).length}}</span>
      </h3>
    </div>
    <div data-each="reply, replyIndex in {{post?.data?.replies ?? []}}">
      <div class="border-t border-slate-200 dark:border-slate-700 px-6 py-4">
        <div class="flex items-center gap-1 mb-2">
          <icon data-type="composite" data-if="{{reply?.is_secret}}" name="lock" size="sm" class="text-slate-500 dark:text-slate-400 flex-shrink-0"/>
          <icon data-type="composite" data-if="{{reply?.status === 'blinded'}}" name="eye-slash" size="sm" class="text-orange-500 dark:text-orange-400 flex-shrink-0"/>
          <a href="/board/{{route.slug}}/{{reply.id}}" class="text-lg font-bold text-teal-600 dark:text-teal-400 hover:underline">{{reply?.title ?? ''}}</a>
          <span data-if="{{reply?.deleted_at}}" class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300 flex-shrink-0">$t:board.post.deleted_badge</span>
        </div>
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100 dark:border-slate-700">
          <div class="flex items-center gap-2">
            <avatar data-type="composite" author="{{reply?.author}}" size="sm"/>
            <user-info data-type="composite" author="{{reply?.author}}" layout="horizontal"/>
          </div>
          <div class="flex items-center gap-3 text-xs text-slate-400 dark:text-slate-500">
            <span title="{{reply?.created_at ?? ''}}">{{reply?.created_at_formatted ?? ''}}</span>
            <span data-if="{{post?.data?.board?.show_view_count !== false &amp;&amp; reply?.view_count !== undefined}}" class="flex items-center gap-1">
              <icon data-type="composite" name="eye" size="xs"/>
              <span>{{reply.view_count}}</span>
            </span>
            <span data-if="{{reply?.comment_count !== undefined &amp;&amp; reply?.comment_count > 0}}" class="flex items-center gap-1">
              <icon data-type="composite" name="message-square" size="xs"/>
              <span>{{reply.comment_count}}</span>
            </span>
          </div>
        </div>
        <div class="text-sm text-slate-600 dark:text-slate-400 mb-2 {{_local?.expandedReplyId === reply?.id ? '' : 'line-clamp-2'}}">
          <span data-if="{{reply?.status === 'blinded'}}" class="italic text-orange-500 dark:text-orange-400">$t:board.blinded_post</span>
          <span data-if="{{reply?.status !== 'blinded' &amp;&amp; reply?.is_secret}}" class="italic text-slate-500 dark:text-slate-400">$t:board.posts.detail.reply_secret_content</span>
          <extension-point name="html_content" data-ref="reply_html_content" data-if="{{reply?.status !== 'blinded' &amp;&amp; !reply?.is_secret}}" content="{{reply?.content ?? ''}}" isHtml="{{(reply?.content_mode ?? 'text') === 'html'}}" class="prose-sm dark:prose-invert max-w-none {{_local?.expandedReplyId === reply?.id ? '' : '[&amp;_img]:hidden [&amp;_table]:hidden'}}">
            <default>
              <html-content data-type="composite" content="{{reply?.content ?? ''}}" isHtml="{{(reply?.content_mode ?? 'text') === 'html'}}" class="prose-sm dark:prose-invert max-w-none {{_local?.expandedReplyId === reply?.id ? '' : '[&amp;_img]:hidden [&amp;_table]:hidden'}}"/>
            </default>
          </extension-point>
        </div>
        <div data-if="{{reply?.status !== 'blinded' &amp;&amp; !reply?.is_secret &amp;&amp; (reply?.content ?? '').length > 200}}" class="flex justify-start">
          <button class="text-sm text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 bg-transparent border-0 p-0 cursor-pointer flex items-center gap-1">
            <on type="click">
              <set-state target="local" expandedReplyId="{{_local?.expandedReplyId === reply?.id ? null : reply?.id}}"/>
            </on>
            <icon data-type="composite" name="{{_local?.expandedReplyId === reply?.id ? 'chevron-up' : 'chevron-down'}}" size="sm"/>
            <span>{{_local?.expandedReplyId === reply?.id ? '$t:board.show_less' : '$t:board.show_more'}}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</partial>
