<partial>
  <form data-key="form" class="space-y-6">
    <on type="submit">
      <set-state target="local" :isLoginAction="true"/>
      <set-state target="global" :isLoggingIn="true" :loginError="null" :loginErrors="null"/>
      <login target="user" body="{{form}}">
        <success>
          <set-state target="global" currentUser="{{response.user}}"/>
          <set-state target="global" :isLoggingIn="false"/>
          <toast type="success" message="$t:auth.login_success"/>
          <navigate path="{{query.redirect ?? '/'}}"/>
        </success>
        <fail>
          <set-state target="global" :isLoggingIn="false" loginError="{{error.message}}" loginErrors="{{error.errors}}"/>
        </fail>
      </login>
    </on>
    <div data-if="{{_global.loginError}}" class="p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
      <p class="text-sm text-red-600 dark:text-red-400">{{_global.loginError}}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-3">$t:auth.email</label>
      <input type="email" name="email" placeholder="$t:auth.email_placeholder" class="{{_global.loginErrors?.email ? 'w-full px-4 py-2 border border-red-500 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-red-500 focus:border-red-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200' : 'w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200'}}" :required="true" disabled="{{_global.isLoggingIn}}"/>
      <p data-if="{{_global.loginErrors?.email}}" class="mt-1 text-sm text-red-600 dark:text-red-400">{{Array.isArray(_global.loginErrors?.email) ? _global.loginErrors.email[0] : _global.loginErrors?.email}}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-3">$t:auth.password</label>
      <password-input name="password" placeholder="$t:auth.password_placeholder" class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200" :required="true" disabled="{{_global.isLoggingIn}}" :showToggle="true" error="{{_global.loginErrors?.password?.[0] ?? (_global.loginErrors?.password ?? '')}}"/>
    </div>
    <button type="submit" class="w-full py-3 mt-12 bg-teal-600 dark:bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-700 dark:hover:bg-teal-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled="{{_global.isLoggingIn}}">
      <div data-if="{{_global.isLoggingIn}}" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/>
      <span data-if="{{!_global.isLoggingIn}}">$t:auth.login</span>
      <span data-if="{{_global.isLoggingIn}}">$t:auth.login_processing</span>
    </button>
  </form>
</partial>
