<partial>
  <button disabled="{{_global.currentUser?.uuid &amp;&amp; posts?.data?.abilities?.can_write !== true}}" class="inline-flex items-center gap-2 px-4 py-2 bg-teal-600 dark:bg-teal-500 text-white rounded-lg hover:bg-teal-700 dark:hover:bg-teal-600 font-medium transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
    <on type="click">
      <switch on="{{posts?.data?.abilities?.can_write ? 'allowed' : (_global.currentUser?.uuid ? 'no_permission' : 'not_logged_in')}}">
        <case when="allowed">
          <navigate path="/board/{{route.slug}}/write"/>
        </case>
        <case when="no_permission">
          <toast type="warning" message="$t:board.no_write_permission"/>
        </case>
        <case when="not_logged_in">
          <toast type="info" message="$t:board.login_required_to_write"/>
          <navigate path="/login">
            <query redirect="/board/{{route.slug}}/write"/>
          </navigate>
        </case>
      </switch>
    </on>
    <icon name="pencil" size="sm"/>
    <span>$t:board.write</span>
  </button>
</partial>
