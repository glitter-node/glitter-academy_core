<partial>
  <modal data-type="composite" data-ref="password_verify_modal" isOpen="{{form_meta?.data?.requires_password &amp;&amp; !_local?.passwordVerified &amp;&amp; !form_meta?.data?.board?.user_abilities?.can_manage}}" title="$t:board.modals.edit_post_title" icon="pen" iconClassName="text-teal-500" width="400px" :closeOnBackdropClick="false">
    <on type="click" event="onClose">
      <navigate path="/board/{{route.slug}}/{{route.id}}"/>
    </on>
    <div class="space-y-4">
      <p class="text-sm text-slate-600 dark:text-slate-400">$t:board.password_verify.description</p>
      <div>
        <div class="flex items-center gap-1.5 mb-1">
          <icon data-type="composite" name="lock" size="xs" class="text-slate-500 dark:text-slate-400"/>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">$t:board.guest_password</span>
        </div>
        <input type="password" placeholder="$t:board.password_verify.placeholder" class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500" value="{{_local.verifyPassword ?? ''}}">
          <on type="change">
            <set-state target="local" verifyPassword="{{$event.target.value}}"/>
          </on>
        </input>
      </div>
      <div data-if="{{_local.passwordError}}" class="text-sm text-red-500">{{_local.passwordError}}</div>
      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer">
          <on type="click">
            <navigate path="/board/{{route.slug}}/{{route.id}}"/>
          </on>
          $t:common.cancel
        </button>
        <button disabled="{{_local.isVerifying || !_local.verifyPassword}}" class="px-4 py-2 bg-teal-600 dark:bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-700 dark:hover:bg-teal-600 disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <set-state target="local" :isVerifying="true" passwordError=""/>
            <api-call target="/api/modules/sirsoft-board/boards/{{route.slug}}/posts/{{route.id}}/verify-password-for-modify" method="POST">
              <success>
                <set-state target="local" :passwordVerified="true" :isVerifying="false" verificationToken="{{result?.data?.verification_token}}" verifyPassword=""/>
                <refetch-data-source dataSourceId="form_meta"/>
                <refetch-data-source dataSourceId="form_data"/>
              </success>
              <fail>
                <set-state target="local" :isVerifying="false" passwordError="$t:board.password_verify.incorrect"/>
              </fail>
              <body password="{{_local.verifyPassword}}"/>
            </api-call>
          </on>
          <icon data-type="composite" data-if="{{_local.isVerifying}}" name="spinner" size="sm" class="animate-spin mr-2"/>
          <span>$t:board.password_verify.confirm</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
