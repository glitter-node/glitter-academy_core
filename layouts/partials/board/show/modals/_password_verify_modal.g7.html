<partial>
  <modal data-type="composite" data-ref="board_guest_password_modal" title="{{_global.guestPasswordModal?.action === 'edit' ? (_global.guestPasswordModal?.targetType === 'comment' ? '$t:board.modals.edit_comment_title' : '$t:board.modals.edit_post_title') : (_global.guestPasswordModal?.targetType === 'comment' ? '$t:board.modals.delete_comment_title' : '$t:board.modals.delete_post_title')}}" icon="{{_global.guestPasswordModal?.action === 'edit' ? 'pen' : 'trash'}}" iconClassName="{{_global.guestPasswordModal?.action === 'edit' ? 'text-teal-500' : 'text-red-500'}}" size="sm">
    <div class="space-y-4">
      <p class="text-sm text-slate-600 dark:text-slate-400">$t:board.password_verify.description</p>
      <div>
        <div class="flex items-center gap-1.5 mb-1">
          <icon data-type="composite" name="lock" size="xs" class="text-slate-500 dark:text-slate-400"/>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">$t:board.guest_password</span>
        </div>
        <input type="password" placeholder="$t:board.guest_password_placeholder" class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500" value="{{_local.guestPasswordForm?.password ?? ''}}">
          <on type="change">
            <set-state target="local">
              <field name="guestPasswordForm">
                <field name="password" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </input>
      </div>
      <div data-if="{{_local.guestPasswordError}}" class="text-sm text-red-500">{{_local.guestPasswordError}}</div>
      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer">
          <on type="click">
            <set-state target="local" :guestPasswordForm="null" guestPasswordError=""/>
            <set-state target="global" :guestPasswordModal="null"/>
            <close-modal/>
          </on>
          $t:common.cancel
        </button>
        <button disabled="{{_global.guestPasswordModal?.isVerifying || !_local.guestPasswordForm?.password}}" class="px-4 py-2 bg-teal-600 dark:bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-700 dark:hover:bg-teal-600 disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <set-state target="global">
              <field name="guestPasswordModal">
                <field name="targetType" value="{{_global.guestPasswordModal?.targetType}}"/>
                <field name="action" value="{{_global.guestPasswordModal?.action}}"/>
                <field name="apiEndpoint" value="{{_global.guestPasswordModal?.apiEndpoint}}"/>
                <field name="storageKey" value="{{_global.guestPasswordModal?.storageKey}}"/>
                <field name="redirectPath" value="{{_global.guestPasswordModal?.redirectPath}}"/>
                <field name="commentEdit" value="{{_global.guestPasswordModal?.commentEdit}}"/>
                <field name="isVerifying" :value="true"/>
              </field>
            </set-state>
            <set-state target="local" guestPasswordError=""/>
            <api-call target="{{_global.guestPasswordModal?.apiEndpoint}}" method="POST">
              <success>
                <set-state if="{{!_global.guestPasswordModal.redirectPath &amp;&amp; _global.guestPasswordModal.commentEdit}}" target="global" commentEdit="{{_global.guestPasswordModal?.commentEdit}}" verifiedGuestPassword="{{_local.guestPasswordForm?.password}}"/>
                <navigate if="{{_global.guestPasswordModal.redirectPath}}" path="{{_global.guestPasswordModal.redirectPath}}"/>
                <set-state target="local" :guestPasswordForm="null" guestPasswordError=""/>
                <set-state target="global" :guestPasswordModal="null"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global">
                  <field name="guestPasswordModal">
                    <field name="targetType" value="{{_global.guestPasswordModal?.targetType}}"/>
                    <field name="action" value="{{_global.guestPasswordModal?.action}}"/>
                    <field name="apiEndpoint" value="{{_global.guestPasswordModal?.apiEndpoint}}"/>
                    <field name="storageKey" value="{{_global.guestPasswordModal?.storageKey}}"/>
                    <field name="redirectPath" value="{{_global.guestPasswordModal?.redirectPath}}"/>
                    <field name="commentEdit" value="{{_global.guestPasswordModal?.commentEdit}}"/>
                    <field name="isVerifying" :value="false"/>
                  </field>
                </set-state>
                <set-state target="local" guestPasswordError="$t:board.password_verify.incorrect"/>
              </fail>
              <body password="{{_local.guestPasswordForm?.password}}"/>
            </api-call>
          </on>
          <icon data-type="composite" data-if="{{_global.guestPasswordModal?.isVerifying}}" name="spinner" size="sm" class="animate-spin mr-2"/>
          <span>$t:board.password_verify.confirm</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
