<partial>
  <div class="flex gap-2 mb-6">
    <div class="flex-1 relative">
      <icon name="search" size="sm" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
      <input type="text" name="q" value="{{query?.q ?? ''}}" placeholder="$t:search.placeholder" class="w-full pl-12 pr-4 py-3 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
        <on type="change">
          <set-state target="local" q="{{$event.target.value}}"/>
        </on>
        <on type="keydown" key="Enter">
          <navigate path="/search">
            <query q="{{$event.target.value}}"/>
          </navigate>
        </on>
      </input>
    </div>
    <button class="px-6 py-3 bg-teal-600 dark:bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-700 dark:hover:bg-teal-600 active:scale-95 active:bg-teal-800 dark:active:bg-teal-600 transition-all cursor-pointer">
      <on type="click">
        <set-state target="global" :searchPage="1"/>
        <navigate path="/search">
          <query q="{{_local.q ?? ''}}"/>
        </navigate>
      </on>
      $t:search.button
    </button>
  </div>
</partial>
