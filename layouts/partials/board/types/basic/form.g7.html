<partial>
  <div class="bg-white dark:bg-slate-800 rounded-lg shadow p-6">
    <div class="mb-6">
      <div class="flex items-center gap-4">
        <button class="text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer">
          <on type="click">
            <navigate path="{{route.id ? '/board/' + route.slug + '/' + route.id : '/board/' + route.slug}}"/>
          </on>
          <icon data-type="composite" name="arrow-left"/>
        </button>
        <div class="flex-1">
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold">
              <span data-if="{{route.id}}">$t:board.edit</span>
              <span data-if="{{!route.id}}">$t:board.write</span>
            </h1>
            <span class="text-sm text-slate-500 dark:text-slate-400">{{form_meta?.data?.board?.name}}</span>
          </div>
        </div>
      </div>
      <div data-if="{{route.id &amp;&amp; form_meta?.data?.author}}" class="mt-3 flex items-center gap-2 text-sm">
        <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 rounded-full px-3 py-1">
          <icon data-type="composite" name="user" size="xs" class="text-slate-500 dark:text-slate-400"/>
          <span class="text-slate-700 dark:text-slate-300 font-medium">{{form_meta?.data?.author?.name}}</span>
          <span data-if="{{form_meta?.data?.is_guest_post}}" class="ml-1 text-xs text-slate-500 dark:text-slate-400">$t:userinfo.guest_badge_parenthesized</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 rounded-full px-3 py-1">
          <icon data-type="composite" name="clock" size="xs" class="text-slate-500 dark:text-slate-400"/>
          <span class="text-slate-600 dark:text-slate-400">{{form_meta?.data?.created_at}}</span>
        </div>
      </div>
    </div>
    <include src="partials/board/form/_parent_post.g7.html"/>
    <include src="partials/board/form/_post_form.g7.html"/>
  </div>
</partial>
